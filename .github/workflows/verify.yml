name: Build and Verify Pixel 2D Website
on:
  push:
    branches: [main, "plan/**", "fix/**"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and smoke test
        run: npm run build
      - name: Inspect output
        run: ls -lh dist/ dist/data/
      - name: Upload static website
        uses: actions/upload-artifact@v4
        with:
          name: hanoi-fishing-static-site
          path: dist/
          if-no-files-found: error
